<script>
// ====== НАСТРОЙКИ ======
const supabaseUrl = 'https://eevkhnenjrskpupvtkgi.supabase.co';
const supabaseKey = 'sb_publishable_6tNocMb7Mv9HqcjVaKxDDQ_PfK1DkXe';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

// ⚠️ ВСТАВЬ СЮДА ССЫЛКУ ТВОЕГО КРАКЕНА С RENDER (без слэша в конце!)
const RENDER_URL = 'https://kyraan-client-bot-1.onrender.com'; 

let allExecutors = [];

// 🛡️ ФУНКЦИЯ ЗАЩИТЫ ОТ XSS (Meta AI одобряет!)
function escapeHTML(str) {
  if (!str) return '';
  return str.replace(/[&<>'"]/g, 
    tag => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[tag])
  );
}

// ====== ИНИЦИАЛИЗАЦИЯ ======
async function loadData() {
  // 1. Загружаем исполнителей из Supabase
  const { data: execs, error: err1 } = await supabase.from('executors').select('*').order('created_at', { ascending: false });
  if (!err1 && execs) {
    allExecutors = execs;
    renderExecutors(execs);
    document.getElementById('stat-executors').innerText = execs.length;
    document.getElementById('stat-online').innerText = execs.filter(e => e.is_online).length;
  }

  // 2. Загружаем заказы из Кракена (JSON)
  try {
    const response = await fetch(`${RENDER_URL}/api/orders`);
    if (response.ok) {
      const orders = await response.json();
      renderOrders(orders);
      document.getElementById('stat-orders').innerText = orders.length;
      document.getElementById('stat-new-orders').innerText = orders.length; 
      
      document.getElementById('sys-status').className = 'status ok';
      document.getElementById('sys-status').innerText = 'Супервайзер: Онлайн';
    }
  } catch (err) {
    console.error("Ошибка загрузки:", err);
    document.getElementById('sys-status').className = 'status off';
    document.getElementById('sys-status').innerText = 'Кракен спит...';
  }
}

// ====== ОТРИСОВКА ЗАКАЗОВ (С защитой XSS) ======
function renderOrders(orders) {
  const container = document.getElementById('orders-list');
  if(!orders || orders.length === 0) { container.innerHTML = '<p class="small">Заказов пока нет.</p>'; return; }
  
  container.innerHTML = orders.map(o => `
    <div class="order-item">
      <div style="display:flex; justify-content:space-between;">
        <b>${escapeHTML(o.service).toUpperCase()} [${escapeHTML(o.tag)}]</b>
        <span class="status ok">NEW</span>
      </div>
      <div class="small" style="margin-top:4px;">📞 ${escapeHTML(o.phone)}</div>
      <div class="small" style="margin-top:4px; color: #a5b4fc;">📝 ${escapeHTML(o.text)}</div>
    </div>
  `).join('');
}

// (Остальные функции renderExecutors, filterExecutors, saveToSupabase, page, menu, go, variants, clearForm оставляем без изменений — они уже есть в твоем коде)
</script>
